<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vow.AI - Futuristic Invitation Builder</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Fix for Lucide React UMD expecting 'react' instead of 'React' -->
    <script>window.react = window.React;</script>

    <!-- Babel Standalone -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Lucide React Icons -->
    <script src="https://unpkg.com/lucide-react@0.469.0/dist/umd/lucide-react.js"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Orbitron:wght@400;700;900&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        cyber: ['Orbitron', 'sans-serif'],
                        ethereal: ['Playfair Display', 'serif'],
                        minimal: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        cyber: {
                            bg: '#050505',
                            primary: '#00f3ff',
                            secondary: '#bc13fe',
                            accent: '#ffe600'
                        },
                        ethereal: {
                            bg: '#fdfbf7',
                            primary: '#8b9d83',
                            secondary: '#d4c5b0',
                            accent: '#e6b8a2'
                        },
                        minimal: {
                            bg: '#ffffff',
                            primary: '#000000',
                            secondary: '#333333',
                            accent: '#666666'
                        }
                    },
                    animation: {
                        'glitch': 'glitch 1s linear infinite',
                        'bloom': 'bloom 2s ease-out forwards',
                        'unfold': 'unfold 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'float': 'float 6s ease-in-out infinite',
                        'scan': 'scan 4s linear infinite',
                        'pulse-slow': 'pulse 3s infinite',
                        'neon-flicker': 'neon-flicker 2s infinite',
                    },
                    keyframes: {
                        glitch: {
                            '2%, 64%': { transform: 'translate(2px,0) skew(0deg)' },
                            '4%, 60%': { transform: 'translate(-2px,0) skew(0deg)' },
                            '62%': { transform: 'translate(0,0) skew(5deg)' },
                        },
                        bloom: {
                            '0%': { opacity: '0', transform: 'scale(0.9) translateY(20px)' },
                            '100%': { opacity: '1', transform: 'scale(1) translateY(0)' },
                        },
                        unfold: {
                            '0%': { opacity: '0', height: '0' },
                            '100%': { opacity: '1', height: 'auto' },
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        },
                        scan: {
                            '0%': { top: '-10%' },
                            '100%': { top: '110%' },
                        },
                        'neon-flicker': {
                            '0%, 19%, 21%, 23%, 25%, 54%, 56%, 100%': {
                                textShadow: '0 0 4px #fff, 0 0 11px #fff, 0 0 19px #fff, 0 0 40px #0fa, 0 0 80px #0fa, 0 0 90px #0fa, 0 0 100px #0fa, 0 0 150px #0fa'
                            },
                            '20%, 24%, 55%': {
                                textShadow: 'none'
                            }
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1a1a1a;
        }
        ::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #666;
        }

        /* Cyberpunk Glitch Effect Utilities */
        .glitch-text {
            position: relative;
        }
        .glitch-text::before,
        .glitch-text::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.8;
        }
        .glitch-text::before {
            left: 2px;
            text-shadow: -1px 0 #00f3ff;
            clip: rect(44px, 450px, 56px, 0);
            animation: glitch-anim 5s infinite linear alternate-reverse;
        }
        .glitch-text::after {
            left: -2px;
            text-shadow: -1px 0 #bc13fe;
            clip: rect(44px, 450px, 56px, 0);
            animation: glitch-anim2 5s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim {
            0% { clip: rect(38px, 9999px, 84px, 0); }
            20% { clip: rect(8px, 9999px, 8px, 0); }
            40% { clip: rect(31px, 9999px, 86px, 0); }
            60% { clip: rect(74px, 9999px, 20px, 0); }
            80% { clip: rect(20px, 9999px, 30px, 0); }
            100% { clip: rect(66px, 9999px, 11px, 0); }
        }
        @keyframes glitch-anim2 {
            0% { clip: rect(10px, 9999px, 91px, 0); }
            20% { clip: rect(68px, 9999px, 16px, 0); }
            40% { clip: rect(2px, 9999px, 34px, 0); }
            60% { clip: rect(55px, 9999px, 79px, 0); }
            80% { clip: rect(93px, 9999px, 46px, 0); }
            100% { clip: rect(27px, 9999px, 25px, 0); }
        }

        /* Scanline Overlay for Cyberpunk */
        .scanlines {
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.1) 50%,
                rgba(0,0,0,0.1)
            );
            background-size: 100% 4px;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            z-index: 50;
            opacity: 0.6;
        }

        /* Neon Glow Effect */
        .neon-glow {
            text-shadow: 0 0 5px #00f3ff, 0 0 10px #00f3ff, 0 0 20px #00f3ff, 0 0 40px #bc13fe, 0 0 80px #bc13fe;
        }

        .neon-border {
            box-shadow: 0 0 5px #00f3ff, 0 0 10px #00f3ff, inset 0 0 5px #00f3ff;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // Destructure Hooks
        const { useState, useEffect, useRef, useMemo } = React;

        // Destructure Icons
        const {
            Heart, Calendar, MapPin, Music, Play, Pause,
            Sparkles, Cpu, Flower, Minimize2, CheckCircle,
            Edit, Eye, Share2, Volume2, VolumeX, Menu, X,
            Radio, Lock, Unlock, Zap, Leaf, Square, Layout
        } = LucideReact;

        // --- Mock Data & Constants ---

        const DEFAULT_EVENT = {
            coupleName: "Alex & Jordan",
            date: "2045-06-15",
            venue: "Neo-Tokyo Sky Garden",
            story: "It started with a glitch in the simulation...",
            timeline: [
                { time: "16:00", title: "Arrival", icon: "MapPin" },
                { time: "17:00", title: "Ceremony", icon: "Heart" },
                { time: "19:00", title: "Reception", icon: "Music" },
                { time: "21:00", title: "Afterparty", icon: "Sparkles" }
            ]
        };

        const THEMES = {
            cyberpunk: {
                id: 'cyberpunk',
                name: 'Cyberpunk 2077',
                font: 'font-cyber',
                bg: 'bg-cyber-bg',
                text: 'text-cyber-primary',
                accent: 'text-cyber-secondary',
                border: 'border-cyber-primary',
                button: 'bg-cyber-primary text-black hover:bg-cyber-secondary hover:text-white hover:neon-glow transition-all duration-300 transform hover:scale-105',
                icon: Cpu,
                cardBg: 'bg-gray-900/80 backdrop-blur-md border border-cyber-primary neon-border'
            },
            ethereal: {
                id: 'ethereal',
                name: 'Ethereal Garden',
                font: 'font-ethereal',
                bg: 'bg-ethereal-bg',
                text: 'text-ethereal-primary',
                accent: 'text-ethereal-secondary',
                border: 'border-ethereal-secondary',
                button: 'bg-ethereal-primary text-white hover:bg-ethereal-secondary transition-all duration-500 shadow-lg hover:shadow-xl rounded-full',
                icon: Leaf,
                cardBg: 'bg-white/60 backdrop-blur-sm border border-ethereal-secondary shadow-lg'
            },
            minimalist: {
                id: 'minimalist',
                name: 'Swiss Minimal',
                font: 'font-minimal',
                bg: 'bg-minimal-bg',
                text: 'text-minimal-primary',
                accent: 'text-minimal-accent',
                border: 'border-minimal-primary',
                button: 'bg-black text-white hover:bg-gray-800 transition-colors duration-200 uppercase tracking-widest text-xs py-3 px-6 rounded-none',
                icon: Square,
                cardBg: 'bg-white border border-gray-200'
            }
        };

        const STORY_PROMPTS = [
            "We met under the neon lights of District 9...",
            "A chance encounter in a coffee shop turned into forever...",
            "Our algorithms matched perfectly, 99.9% compatibility...",
            "Two souls wandering the digital expanse found a connection..."
        ];

        // --- Custom Hooks ---

        const useIntersectionObserver = (options) => {
            const [elements, setElements] = useState([]);
            const [entries, setEntries] = useState([]);

            const observer = useRef(null);

            useEffect(() => {
                if (elements.length) {
                    observer.current = new IntersectionObserver((ioEntries) => {
                        setEntries(ioEntries);
                    }, options);

                    elements.forEach(el => observer.current.observe(el));
                }
                return () => {
                    if (observer.current) observer.current.disconnect();
                }
            }, [elements, options]);

            return [setElements, entries];
        };

        // --- Components ---

        // Audio Player Component
        const MusicPlayer = ({ isPlaying, togglePlay, theme }) => {
            const audioRef = useRef(null);
            const t = THEMES[theme];

            useEffect(() => {
                if (audioRef.current) {
                    if (isPlaying) audioRef.current.play().catch(e => console.log("Autoplay blocked", e));
                    else audioRef.current.pause();
                }
            }, [isPlaying]);

            // Using a reliable royalty-free track
            const audioUrl = "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3";

            return (
                <div className={`fixed bottom-4 right-4 z-50 transition-all duration-300 animate-bloom`}>
                    <audio ref={audioRef} src={audioUrl} loop />
                    <button
                        onClick={togglePlay}
                        className={`p-4 rounded-full shadow-2xl flex items-center justify-center ${t.button} ${theme === 'cyberpunk' ? 'neon-border' : ''}`}
                    >
                        {isPlaying ? <Pause size={24} /> : <Play size={24} />}
                    </button>
                </div>
            );
        };

        // RSVP Modal Component
        const RSVPModal = ({ isOpen, onClose, onConfirm, theme }) => {
            if (!isOpen) return null;

            const t = THEMES[theme];

            return (
                <div className="fixed inset-0 z-[60] flex items-center justify-center bg-black/80 backdrop-blur-sm p-4 transition-opacity duration-300">
                    <div className={`relative w-full max-w-md p-8 rounded-xl ${t.cardBg} animate-bloom`}>
                        <button onClick={onClose} className="absolute top-4 right-4 hover:opacity-70 transition-opacity"><X /></button>
                        <h2 className={`text-3xl font-bold mb-4 ${t.font} ${t.text}`}>RSVP Status</h2>
                        <p className={`mb-6 opacity-80 ${t.text}`}>Please confirm your attendance sequence.</p>

                        <div className="flex gap-4">
                            <button
                                onClick={onConfirm}
                                className={`flex-1 py-3 px-6 font-bold text-center ${t.button}`}
                            >
                                CONFIRM ACCESS
                            </button>
                            <button
                                onClick={onClose}
                                className={`flex-1 py-3 px-6 rounded border border-current opacity-60 hover:opacity-100 transition-opacity ${t.text}`}
                            >
                                DECLINE
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // Timeline Component
        const Timeline = ({ events, theme }) => {
            const t = THEMES[theme];
            const [setElements, entries] = useIntersectionObserver({ threshold: 0.2 });

            useEffect(() => {
                const elements = Array.from(document.querySelectorAll('.timeline-item'));
                setElements(elements);
            }, [setElements]);

            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('opacity-100', 'translate-x-0');
                    entry.target.classList.remove('opacity-0', '-translate-x-10');
                }
            });

            return (
                <div className="relative border-l-2 ml-4 my-8 pl-8 space-y-12" style={{ borderColor: theme === 'minimalist' ? '#000' : t.primary }}>
                    {events.map((event, idx) => (
                        <div key={idx} className="timeline-item relative group opacity-0 -translate-x-10 transition-all duration-700 ease-out" style={{ transitionDelay: `${idx * 200}ms` }}>
                            <div className={`absolute -left-[41px] p-2 rounded-full border-2 ${t.bg} ${t.border} z-10 shadow-lg`}>
                                {event.icon === 'Heart' && <Heart size={16} className={t.text} />}
                                {event.icon === 'Music' && <Music size={16} className={t.text} />}
                                {event.icon === 'Sparkles' && <Sparkles size={16} className={t.text} />}
                                {event.icon === 'MapPin' && <MapPin size={16} className={t.text} />}
                            </div>
                            <div className={`p-6 rounded-lg ${t.cardBg} hover:transform hover:scale-[1.02] transition-transform duration-300`}>
                                <span className={`text-sm font-bold opacity-70 block mb-1 ${t.accent}`}>{event.time}</span>
                                <h3 className={`text-xl font-bold ${t.font} ${t.text}`}>{event.title}</h3>
                            </div>
                        </div>
                    ))}
                </div>
            );
        };

        // Guest View Component
        const GuestView = ({ content, theme, setRsvpStatus, rsvpStatus, isPlaying, togglePlay, isPreview = false }) => {
            const t = THEMES[theme];
            const [isOpened, setIsOpened] = useState(false);
            const [showRSVP, setShowRSVP] = useState(false);

            const handleOpen = () => {
                setIsOpened(true);
                if (!isPlaying && !isPreview) togglePlay();
            };

            const handleRSVP = () => {
                setRsvpStatus('confirmed');
                setShowRSVP(false);
            };

            const containerClass = isPreview ? "absolute inset-0" : "fixed inset-0";

            // Opening Animations based on Theme
            if (!isOpened) {
                return (
                    <div className={`${containerClass} z-50 flex flex-col items-center justify-center ${t.bg} transition-colors duration-1000 overflow-hidden`}>
                        {theme === 'cyberpunk' && <div className="scanlines"></div>}

                        <div className="text-center cursor-pointer group" onClick={handleOpen}>
                            {theme === 'cyberpunk' && (
                                <div className="relative transform hover:scale-110 transition-transform duration-500">
                                    <div className="w-32 h-32 border-4 border-cyan-500 rounded-full flex items-center justify-center animate-spin duration-[3000ms] shadow-[0_0_30px_rgba(0,243,255,0.6)]">
                                        <div className="w-24 h-24 border-2 border-fuchsia-500 rounded-full animate-pulse shadow-[0_0_20px_rgba(188,19,254,0.6)]"></div>
                                    </div>
                                    <p className="mt-8 font-cyber text-cyan-400 tracking-[0.5em] animate-pulse glitch-text text-xl" data-text="INITIATE">INITIATE</p>
                                </div>
                            )}

                            {theme === 'ethereal' && (
                                <div className="relative animate-float transform hover:scale-110 transition-transform duration-700">
                                    <div className="absolute inset-0 bg-green-100 blur-3xl opacity-50 rounded-full"></div>
                                    <Flower size={100} className="text-green-800 opacity-80 relative z-10" strokeWidth={0.5} />
                                    <p className="mt-8 font-ethereal text-3xl text-green-900 tracking-widest italic opacity-80 group-hover:opacity-100 transition-opacity">Open Invitation</p>
                                </div>
                            )}

                            {theme === 'minimalist' && (
                                <div className="relative flex flex-col items-center">
                                    <div className="w-px h-20 bg-black mb-6 group-hover:h-32 transition-all duration-700 ease-in-out"></div>
                                    <p className="font-minimal text-black uppercase tracking-[0.5em] text-sm group-hover:tracking-[0.8em] transition-all duration-700">Unfold</p>
                                    <div className="w-px h-20 bg-black mt-6 ml-auto group-hover:h-32 transition-all duration-700 ease-in-out"></div>
                                </div>
                            )}
                        </div>
                    </div>
                );
            }

            return (
                <div className={`min-h-screen w-full overflow-x-hidden ${t.bg} ${t.text} transition-colors duration-500 ${isPreview ? 'absolute inset-0 overflow-y-auto' : ''}`}>
                    {theme === 'cyberpunk' && <div className="scanlines"></div>}
                    {theme === 'ethereal' && <div className="fixed inset-0 pointer-events-none bg-gradient-to-b from-transparent via-white/20 to-transparent z-0"></div>}

                    <MusicPlayer isPlaying={isPlaying} togglePlay={togglePlay} theme={theme} />
                    <RSVPModal isOpen={showRSVP} onClose={() => setShowRSVP(false)} onConfirm={handleRSVP} theme={theme} />

                    {/* Hero Section */}
                    <header className={`min-h-screen flex flex-col items-center justify-center p-8 text-center animate-unfold relative z-10`}>
                        <div className={`absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-current to-transparent opacity-20`}></div>

                        <p className={`text-sm md:text-lg mb-6 tracking-[0.3em] uppercase opacity-70`}>You Are Invited To The Union Of</p>
                        <h1 className={`text-5xl md:text-8xl font-bold mb-8 ${t.font} ${theme === 'cyberpunk' ? 'glitch-text neon-glow' : ''}`} data-text={content.coupleName}>
                            {content.coupleName}
                        </h1>

                        <div className={`flex flex-col md:flex-row items-center justify-center gap-6 text-lg md:text-2xl mt-8 ${t.accent} font-light`}>
                            <div className="flex items-center gap-2">
                                <Calendar size={20} />
                                <span>{content.date}</span>
                            </div>
                            <span className="hidden md:inline mx-2 opacity-50">|</span>
                            <div className="flex items-center gap-2">
                                <MapPin size={20} />
                                <span>{content.venue}</span>
                            </div>
                        </div>

                        <div className="absolute bottom-10 animate-bounce cursor-pointer opacity-50 hover:opacity-100 transition-opacity">
                            <p className="text-xs uppercase tracking-widest">Scroll to Explore</p>
                        </div>
                    </header>

                    {/* Story Section */}
                    <section className="py-24 px-8 max-w-4xl mx-auto relative z-10">
                        <h2 className={`text-3xl md:text-5xl font-bold mb-16 text-center ${t.font}`}>Our Story</h2>
                        <div className={`p-8 md:p-16 rounded-2xl ${t.cardBg} leading-loose text-lg md:text-xl text-justify transition-all duration-500 hover:shadow-2xl`}>
                            {content.story}
                        </div>
                    </section>

                    {/* Timeline Section */}
                    <section className="py-24 px-8 max-w-2xl mx-auto relative z-10">
                        <h2 className={`text-3xl md:text-5xl font-bold mb-16 text-center ${t.font}`}>Timeline</h2>
                        <Timeline events={content.timeline} theme={theme} />
                    </section>

                    {/* RSVP Section */}
                    <footer className="py-40 px-8 text-center relative overflow-hidden z-10">
                        <div className={`absolute inset-0 opacity-5 ${theme === 'minimalist' ? 'bg-gray-200' : (theme === 'cyberpunk' ? 'bg-cyan-900' : 'bg-green-100')}`}></div>
                        <h2 className={`text-4xl md:text-6xl font-bold mb-12 ${t.font}`}>Join Us</h2>

                        {rsvpStatus === 'confirmed' ? (
                            <div className="inline-flex flex-col items-center p-12 border-2 border-green-500 rounded-2xl bg-green-500/10 animate-bloom backdrop-blur-sm">
                                <CheckCircle size={64} className="text-green-500 mb-6" />
                                <span className="text-2xl font-bold text-green-500 uppercase tracking-widest">Access Granted</span>
                                <p className="mt-4 text-base opacity-70">We look forward to celebrating with you.</p>
                            </div>
                        ) : (
                            <button
                                onClick={() => setShowRSVP(true)}
                                className={`py-5 px-16 text-xl font-bold uppercase tracking-[0.2em] transition-all hover:scale-105 shadow-xl ${t.button}`}
                            >
                                RSVP Now
                            </button>
                        )}
                    </footer>
                </div>
            );
        };

        // Builder (Admin) Component
        const Builder = ({ content, setContent, theme, setTheme, onPreview }) => {
            const [isGenerating, setIsGenerating] = useState(false);

            const handleInputChange = (e) => {
                const { name, value } = e.target;
                setContent(prev => ({ ...prev, [name]: value }));
            };

            const generateStory = () => {
                setIsGenerating(true);
                setTimeout(() => {
                    const randomStory = STORY_PROMPTS[Math.floor(Math.random() * STORY_PROMPTS.length)];
                    setContent(prev => ({ ...prev, story: randomStory + " (AI Generated)" }));
                    setIsGenerating(false);
                }, 1500);
            };

            return (
                <div className="min-h-screen bg-gray-900 text-gray-100 font-sans flex flex-col md:flex-row overflow-hidden">
                    {/* Sidebar / Editor */}
                    <div className="w-full md:w-1/2 lg:w-5/12 p-6 md:p-8 overflow-y-auto border-r border-gray-800 flex flex-col h-screen">
                        <header className="flex justify-between items-center mb-10 pb-6 border-b border-gray-800">
                            <h1 className="text-2xl font-bold flex items-center gap-3 tracking-wide">
                                <div className="p-2 bg-cyan-500/10 rounded-lg">
                                    <Cpu className="text-cyan-400" size={24} />
                                </div>
                                <span>Vow.AI</span>
                                <span className="text-[10px] bg-cyan-900/50 text-cyan-300 px-2 py-1 rounded border border-cyan-800 tracking-wider">BUILDER v2.0</span>
                            </h1>
                        </header>

                        <div className="space-y-10 flex-grow">
                            {/* Theme Selection */}
                            <div className="space-y-4">
                                <h2 className="text-sm font-semibold uppercase tracking-wider text-gray-500 flex items-center gap-2">
                                    <Sparkles size={14} /> Design Language
                                </h2>
                                <div className="grid grid-cols-3 gap-4">
                                    {Object.values(THEMES).map((t) => (
                                        <button
                                            key={t.id}
                                            onClick={() => setTheme(t.id)}
                                            className={`group relative p-4 rounded-xl border-2 text-center transition-all duration-300 overflow-hidden ${
                                                theme === t.id
                                                ? 'border-cyan-500 bg-gray-800 shadow-[0_0_20px_rgba(6,182,212,0.15)]'
                                                : 'border-gray-800 hover:border-gray-600 bg-gray-800/50'
                                            }`}
                                        >
                                            <div className={`absolute inset-0 opacity-0 group-hover:opacity-10 transition-opacity bg-gradient-to-br from-white to-transparent`}></div>
                                            <div className="flex justify-center mb-3">
                                                <t.icon size={28} className={`transition-colors duration-300 ${theme === t.id ? 'text-cyan-400' : 'text-gray-500 group-hover:text-gray-300'}`} />
                                            </div>
                                            <span className={`text-xs font-bold tracking-wide block ${theme === t.id ? 'text-white' : 'text-gray-400'}`}>{t.name}</span>
                                        </button>
                                    ))}
                                </div>
                            </div>

                            {/* Details Form */}
                            <div className="space-y-6">
                                <h2 className="text-sm font-semibold uppercase tracking-wider text-gray-500 flex items-center gap-2">
                                    <Edit size={14} /> Event Parameters
                                </h2>

                                <div className="space-y-4">
                                    <div className="grid grid-cols-2 gap-4">
                                        <div className="group">
                                            <label className="block text-xs font-medium text-gray-400 mb-2 group-focus-within:text-cyan-400 transition-colors">Couple Name</label>
                                            <input
                                                type="text"
                                                name="coupleName"
                                                value={content.coupleName}
                                                onChange={handleInputChange}
                                                className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-sm focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 focus:outline-none transition-all placeholder-gray-600"
                                                placeholder="e.g. Alex & Jordan"
                                            />
                                        </div>
                                        <div className="group">
                                            <label className="block text-xs font-medium text-gray-400 mb-2 group-focus-within:text-cyan-400 transition-colors">Date</label>
                                            <input
                                                type="date"
                                                name="date"
                                                value={content.date}
                                                onChange={handleInputChange}
                                                className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-sm focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 focus:outline-none transition-all text-gray-300"
                                            />
                                        </div>
                                    </div>
                                    <div className="group">
                                        <label className="block text-xs font-medium text-gray-400 mb-2 group-focus-within:text-cyan-400 transition-colors">Venue Location</label>
                                        <div className="relative">
                                            <MapPin size={16} className="absolute left-3 top-3 text-gray-500" />
                                            <input
                                                type="text"
                                                name="venue"
                                                value={content.venue}
                                                onChange={handleInputChange}
                                                className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 pl-10 text-sm focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 focus:outline-none transition-all placeholder-gray-600"
                                                placeholder="e.g. Neo-Tokyo Sky Garden"
                                            />
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {/* AI Story Generator */}
                            <div className="space-y-4">
                                <div className="flex justify-between items-center">
                                    <h2 className="text-sm font-semibold uppercase tracking-wider text-gray-500 flex items-center gap-2">
                                        <Zap size={14} /> Narrative Engine
                                    </h2>
                                    <button
                                        onClick={generateStory}
                                        disabled={isGenerating}
                                        className="text-[10px] font-bold bg-purple-600 hover:bg-purple-500 text-white px-3 py-1.5 rounded-full flex items-center gap-1.5 disabled:opacity-50 disabled:cursor-not-allowed transition-all shadow-lg hover:shadow-purple-500/20"
                                    >
                                        {isGenerating ? (
                                            <>
                                                <span className="animate-spin h-3 w-3 border-2 border-white border-t-transparent rounded-full"></span>
                                                GENERATING...
                                            </>
                                        ) : (
                                            <>
                                                <Sparkles size={10} /> AUTO-GENERATE
                                            </>
                                        )}
                                    </button>
                                </div>
                                <div className="relative group">
                                    <textarea
                                        name="story"
                                        value={content.story}
                                        onChange={handleInputChange}
                                        rows={5}
                                        className="w-full bg-gray-800 border border-gray-700 rounded-lg p-4 text-sm focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 focus:outline-none transition-all resize-none leading-relaxed placeholder-gray-600"
                                        placeholder="Tell your story..."
                                    />
                                    <div className="absolute bottom-3 right-3 text-[10px] text-gray-600 uppercase tracking-wider font-bold">
                                        {content.story.length} chars
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Mobile Preview Button (Visible only on small screens) */}
                        <div className="md:hidden mt-8 pt-6 border-t border-gray-800">
                             <button
                                onClick={onPreview}
                                className="w-full bg-cyan-500 hover:bg-cyan-400 text-black py-4 rounded-xl font-bold flex items-center justify-center gap-2 transition-all shadow-lg shadow-cyan-500/20"
                            >
                                <Eye size={20} /> Preview Invitation
                            </button>
                        </div>
                    </div>

                    {/* Desktop Live Preview */}
                    <div className="hidden md:flex w-1/2 lg:w-7/12 bg-black items-center justify-center p-8 relative overflow-hidden">
                        <div className="absolute inset-0 opacity-20" style={{ backgroundImage: 'radial-gradient(#333 1px, transparent 1px)', backgroundSize: '20px 20px' }}></div>

                        <div className="relative w-[375px] h-[812px] bg-black rounded-[40px] border-[8px] border-gray-800 overflow-hidden shadow-2xl transform scale-90 lg:scale-100 transition-transform duration-500 ring-1 ring-gray-700">
                             <div className="absolute top-0 left-0 right-0 h-6 bg-black z-20 flex justify-center items-end pb-1">
                                 <div className="w-20 h-4 bg-black rounded-b-xl border border-gray-800 border-t-0"></div>
                             </div>
                             <div className="h-full w-full relative bg-white">
                                <GuestView
                                    content={content}
                                    theme={theme}
                                    rsvpStatus="pending"
                                    setRsvpStatus={() => {}}
                                    isPlaying={false}
                                    togglePlay={() => {}}
                                    isPreview={true}
                                />
                             </div>

                             {/* Floating Action Button for Desktop Preview */}
                             <div className="absolute bottom-6 right-6 z-50">
                                 <button
                                    onClick={onPreview}
                                    className="bg-white text-black p-4 rounded-full shadow-lg hover:scale-110 transition-transform"
                                    title="Open Full Screen"
                                 >
                                     <Layout size={24} />
                                 </button>
                             </div>
                        </div>
                    </div>
                </div>
            );
        };

        // Main App Orchestrator
        function App() {
            const [mode, setMode] = useState('builder'); // 'builder' | 'guest'
            const [theme, setTheme] = useState('cyberpunk');
            const [content, setContent] = useState(DEFAULT_EVENT);
            const [rsvpStatus, setRsvpStatus] = useState('pending');
            const [isPlaying, setIsPlaying] = useState(false);

            const togglePlay = () => setIsPlaying(!isPlaying);

            return (
                <React.Fragment>
                    {mode === 'builder' ? (
                        <Builder
                            content={content}
                            setContent={setContent}
                            theme={theme}
                            setTheme={setTheme}
                            onPreview={() => setMode('guest')}
                        />
                    ) : (
                        <div className="relative">
                             <button
                                onClick={() => setMode('builder')}
                                className="fixed top-6 left-6 z-[100] bg-black/50 hover:bg-black text-white p-3 rounded-full backdrop-blur border border-white/20 transition-all hover:scale-110 shadow-xl"
                                title="Back to Builder"
                            >
                                <Edit size={20} />
                            </button>
                            <GuestView
                                content={content}
                                theme={theme}
                                rsvpStatus={rsvpStatus}
                                setRsvpStatus={setRsvpStatus}
                                isPlaying={isPlaying}
                                togglePlay={togglePlay}
                            />
                        </div>
                    )}
                </React.Fragment>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
