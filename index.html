<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vow.AI - Futuristic Invitation Builder</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Fix for Lucide React UMD expecting 'react' instead of 'React' -->
    <script>window.react = window.React;</script>

    <!-- Babel Standalone -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Lucide React Icons -->
    <script src="https://unpkg.com/lucide-react@0.469.0/dist/umd/lucide-react.js"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Orbitron:wght@400;700;900&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        cyber: ['Orbitron', 'sans-serif'],
                        ethereal: ['Playfair Display', 'serif'],
                        minimal: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        cyber: {
                            bg: '#050505',
                            primary: '#00f3ff',
                            secondary: '#bc13fe',
                            accent: '#ffe600'
                        },
                        ethereal: {
                            bg: '#fdfbf7',
                            primary: '#8b9d83',
                            secondary: '#d4c5b0',
                            accent: '#e6b8a2'
                        },
                        minimal: {
                            bg: '#ffffff',
                            primary: '#000000',
                            secondary: '#333333',
                            accent: '#666666'
                        }
                    },
                    animation: {
                        'glitch': 'glitch 1s linear infinite',
                        'bloom': 'bloom 2s ease-out forwards',
                        'unfold': 'unfold 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'float': 'float 6s ease-in-out infinite',
                        'scan': 'scan 4s linear infinite',
                    },
                    keyframes: {
                        glitch: {
                            '2%, 64%': { transform: 'translate(2px,0) skew(0deg)' },
                            '4%, 60%': { transform: 'translate(-2px,0) skew(0deg)' },
                            '62%': { transform: 'translate(0,0) skew(5deg)' },
                        },
                        bloom: {
                            '0%': { opacity: '0', transform: 'scale(0.9) translateY(20px)' },
                            '100%': { opacity: '1', transform: 'scale(1) translateY(0)' },
                        },
                        unfold: {
                            '0%': { opacity: '0', height: '0' },
                            '100%': { opacity: '1', height: 'auto' },
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        },
                        scan: {
                            '0%': { top: '-10%' },
                            '100%': { top: '110%' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1a1a1a;
        }
        ::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #666;
        }

        /* Cyberpunk Glitch Effect Utilities */
        .glitch-text {
            position: relative;
        }
        .glitch-text::before,
        .glitch-text::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .glitch-text::before {
            left: 2px;
            text-shadow: -1px 0 #00f3ff;
            clip: rect(44px, 450px, 56px, 0);
            animation: glitch-anim 5s infinite linear alternate-reverse;
        }
        .glitch-text::after {
            left: -2px;
            text-shadow: -1px 0 #bc13fe;
            clip: rect(44px, 450px, 56px, 0);
            animation: glitch-anim2 5s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim {
            0% { clip: rect(38px, 9999px, 84px, 0); }
            20% { clip: rect(8px, 9999px, 8px, 0); }
            40% { clip: rect(31px, 9999px, 86px, 0); }
            60% { clip: rect(74px, 9999px, 20px, 0); }
            80% { clip: rect(20px, 9999px, 30px, 0); }
            100% { clip: rect(66px, 9999px, 11px, 0); }
        }
        @keyframes glitch-anim2 {
            0% { clip: rect(10px, 9999px, 91px, 0); }
            20% { clip: rect(68px, 9999px, 16px, 0); }
            40% { clip: rect(2px, 9999px, 34px, 0); }
            60% { clip: rect(55px, 9999px, 79px, 0); }
            80% { clip: rect(93px, 9999px, 46px, 0); }
            100% { clip: rect(27px, 9999px, 25px, 0); }
        }

        /* Scanline Overlay for Cyberpunk */
        .scanlines {
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.1) 50%,
                rgba(0,0,0,0.1)
            );
            background-size: 100% 4px;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            z-index: 50;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // Destructure Hooks
        const { useState, useEffect, useRef, useMemo } = React;

        // Destructure Icons
        const {
            Heart, Calendar, MapPin, Music, Play, Pause,
            Sparkles, Cpu, Flower, Minimize2, CheckCircle,
            Edit, Eye, Share2, Volume2, VolumeX, Menu, X,
            Radio, Lock, Unlock, Zap, Leaf, Square
        } = LucideReact;

        // --- Mock Data & Constants ---

        const DEFAULT_EVENT = {
            coupleName: "Alex & Jordan",
            date: "2045-06-15",
            venue: "Neo-Tokyo Sky Garden",
            story: "It started with a glitch in the simulation...",
            timeline: [
                { time: "16:00", title: "Arrival", icon: "MapPin" },
                { time: "17:00", title: "Ceremony", icon: "Heart" },
                { time: "19:00", title: "Reception", icon: "Music" },
                { time: "21:00", title: "Afterparty", icon: "Sparkles" }
            ]
        };

        const THEMES = {
            cyberpunk: {
                id: 'cyberpunk',
                name: 'Cyberpunk 2077',
                font: 'font-cyber',
                bg: 'bg-cyber-bg',
                text: 'text-cyber-primary',
                accent: 'text-cyber-secondary',
                border: 'border-cyber-primary',
                button: 'bg-cyber-primary text-black hover:bg-cyber-secondary hover:text-white',
                icon: Cpu
            },
            ethereal: {
                id: 'ethereal',
                name: 'Ethereal Garden',
                font: 'font-ethereal',
                bg: 'bg-ethereal-bg',
                text: 'text-ethereal-primary',
                accent: 'text-ethereal-secondary',
                border: 'border-ethereal-secondary',
                button: 'bg-ethereal-primary text-white hover:bg-ethereal-secondary',
                icon: Leaf
            },
            minimalist: {
                id: 'minimalist',
                name: 'Swiss Minimal',
                font: 'font-minimal',
                bg: 'bg-minimal-bg',
                text: 'text-minimal-primary',
                accent: 'text-minimal-accent',
                border: 'border-minimal-primary',
                button: 'bg-black text-white hover:bg-gray-800',
                icon: Square
            }
        };

        const STORY_PROMPTS = [
            "We met under the neon lights of District 9...",
            "A chance encounter in a coffee shop turned into forever...",
            "Our algorithms matched perfectly, 99.9% compatibility...",
            "Two souls wandering the digital expanse found a connection..."
        ];

        // --- Components ---

        // Audio Player Component
        const MusicPlayer = ({ isPlaying, togglePlay, theme }) => {
            const audioRef = useRef(null);

            useEffect(() => {
                if (audioRef.current) {
                    if (isPlaying) audioRef.current.play().catch(e => console.log("Autoplay blocked", e));
                    else audioRef.current.pause();
                }
            }, [isPlaying]);

            // Using a reliable royalty-free track
            const audioUrl = "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3";

            return (
                <div className={`fixed bottom-4 right-4 z-50 p-2 rounded-full border ${THEMES[theme].bg} ${THEMES[theme].border} shadow-lg transition-all duration-300`}>
                    <audio ref={audioRef} src={audioUrl} loop />
                    <button onClick={togglePlay} className={`p-3 rounded-full ${THEMES[theme].button}`}>
                        {isPlaying ? <Pause size={20} /> : <Play size={20} />}
                    </button>
                </div>
            );
        };

        // RSVP Modal Component
        const RSVPModal = ({ isOpen, onClose, onConfirm, theme }) => {
            if (!isOpen) return null;

            const t = THEMES[theme];

            return (
                <div className="fixed inset-0 z-[60] flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
                    <div className={`relative w-full max-w-md p-8 rounded-xl ${t.bg} border-2 ${t.border} shadow-2xl animate-bloom`}>
                        <button onClick={onClose} className="absolute top-4 right-4"><X /></button>
                        <h2 className={`text-3xl font-bold mb-4 ${t.font} ${t.text}`}>RSVP Status</h2>
                        <p className="mb-6 opacity-80">Please confirm your attendance sequence.</p>

                        <div className="flex gap-4">
                            <button
                                onClick={onConfirm}
                                className={`flex-1 py-3 px-6 rounded font-bold text-center transition-transform hover:scale-105 ${t.button}`}
                            >
                                CONFIRM ACCESS
                            </button>
                            <button
                                onClick={onClose}
                                className="flex-1 py-3 px-6 rounded border border-current opacity-60 hover:opacity-100"
                            >
                                DECLINE
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // Timeline Component
        const Timeline = ({ events, theme }) => {
            const t = THEMES[theme];
            return (
                <div className="relative border-l-2 ml-4 my-8 pl-8 space-y-8" style={{ borderColor: t.primary }}>
                    {events.map((event, idx) => (
                        <div key={idx} className="relative group">
                            <div className={`absolute -left-[41px] p-2 rounded-full border-2 ${t.bg} ${t.border}`}>
                                {event.icon === 'Heart' && <Heart size={16} className={t.text} />}
                                {event.icon === 'Music' && <Music size={16} className={t.text} />}
                                {event.icon === 'Sparkles' && <Sparkles size={16} className={t.text} />}
                                {event.icon === 'MapPin' && <MapPin size={16} className={t.text} />}
                            </div>
                            <div className={`p-4 rounded border ${t.border} bg-opacity-10 backdrop-blur hover:bg-opacity-20 transition-all`}>
                                <span className={`text-sm font-bold opacity-70 ${t.accent}`}>{event.time}</span>
                                <h3 className={`text-xl font-bold ${t.font} ${t.text}`}>{event.title}</h3>
                            </div>
                        </div>
                    ))}
                </div>
            );
        };

        // Guest View Component
        const GuestView = ({ content, theme, setRsvpStatus, rsvpStatus, isPlaying, togglePlay, isPreview = false }) => {
            const t = THEMES[theme];
            const [isOpened, setIsOpened] = useState(false);
            const [showRSVP, setShowRSVP] = useState(false);

            const handleOpen = () => {
                setIsOpened(true);
                if (!isPlaying) togglePlay();
            };

            const handleRSVP = () => {
                setRsvpStatus('confirmed');
                setShowRSVP(false);
            };

            const containerClass = isPreview ? "absolute inset-0" : "fixed inset-0";

            // Opening Animations based on Theme
            if (!isOpened) {
                return (
                    <div className={`${containerClass} z-50 flex flex-col items-center justify-center ${t.bg} transition-colors duration-1000`}>
                        {theme === 'cyberpunk' && <div className="scanlines"></div>}

                        <div className="text-center cursor-pointer group" onClick={handleOpen}>
                            {theme === 'cyberpunk' && (
                                <div className="relative">
                                    <div className="w-24 h-24 border-4 border-cyan-500 rounded-full flex items-center justify-center animate-spin duration-[3000ms]">
                                        <div className="w-20 h-20 border-2 border-fuchsia-500 rounded-full animate-pulse"></div>
                                    </div>
                                    <p className="mt-8 font-cyber text-cyan-400 tracking-widest animate-pulse glitch-text" data-text="INITIATE SEQUENCE">INITIATE SEQUENCE</p>
                                </div>
                            )}

                            {theme === 'ethereal' && (
                                <div className="relative animate-float">
                                    <Flower size={80} className="text-green-800 opacity-80" strokeWidth={1} />
                                    <p className="mt-6 font-ethereal text-2xl text-green-900 tracking-widest">Open Invitation</p>
                                </div>
                            )}

                            {theme === 'minimalist' && (
                                <div className="relative">
                                    <div className="w-20 h-[1px] bg-black mb-4 group-hover:w-32 transition-all duration-500"></div>
                                    <p className="font-minimal text-black uppercase tracking-[0.3em] text-sm">Unfold</p>
                                    <div className="w-20 h-[1px] bg-black mt-4 ml-auto group-hover:w-32 transition-all duration-500"></div>
                                </div>
                            )}
                        </div>
                    </div>
                );
            }

            return (
                <div className={`min-h-screen w-full overflow-x-hidden ${t.bg} ${t.text} transition-colors duration-500 ${isPreview ? 'absolute inset-0 overflow-y-auto' : ''}`}>
                    {theme === 'cyberpunk' && <div className="scanlines"></div>}

                    <MusicPlayer isPlaying={isPlaying} togglePlay={togglePlay} theme={theme} />
                    <RSVPModal isOpen={showRSVP} onClose={() => setShowRSVP(false)} onConfirm={handleRSVP} theme={theme} />

                    {/* Hero Section */}
                    <header className={`min-h-screen flex flex-col items-center justify-center p-8 text-center animate-unfold relative`}>
                        <div className={`absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-current to-transparent opacity-20`}></div>

                        <p className={`text-lg md:text-xl mb-4 tracking-widest uppercase opacity-70`}>You Are Invited To The Union Of</p>
                        <h1 className={`text-5xl md:text-8xl font-bold mb-6 ${t.font} glitch-text`} data-text={content.coupleName}>
                            {content.coupleName}
                        </h1>

                        <div className={`flex items-center gap-4 text-lg md:text-2xl mt-8 ${t.accent}`}>
                            <Calendar size={24} />
                            <span>{content.date}</span>
                            <span className="mx-2">|</span>
                            <MapPin size={24} />
                            <span>{content.venue}</span>
                        </div>

                        <div className="absolute bottom-10 animate-bounce">
                            <p className="text-xs uppercase tracking-widest opacity-50">Scroll to Explore</p>
                        </div>
                    </header>

                    {/* Story Section */}
                    <section className="py-20 px-8 max-w-4xl mx-auto">
                        <h2 className={`text-3xl md:text-4xl font-bold mb-12 text-center ${t.font}`}>Our Story</h2>
                        <div className={`p-8 md:p-12 rounded-xl border ${t.border} bg-opacity-5 backdrop-blur-sm leading-relaxed text-lg text-justify`}>
                            {content.story}
                        </div>
                    </section>

                    {/* Timeline Section */}
                    <section className="py-20 px-8 max-w-2xl mx-auto">
                        <h2 className={`text-3xl md:text-4xl font-bold mb-12 text-center ${t.font}`}>Timeline</h2>
                        <Timeline events={content.timeline} theme={theme} />
                    </section>

                    {/* RSVP Section */}
                    <footer className="py-32 px-8 text-center relative overflow-hidden">
                        <div className={`absolute inset-0 opacity-10 ${t.bg === 'bg-black' ? 'bg-white' : 'bg-black'}`}></div>
                        <h2 className={`text-3xl md:text-5xl font-bold mb-8 ${t.font}`}>Join Us</h2>

                        {rsvpStatus === 'confirmed' ? (
                            <div className="inline-flex flex-col items-center p-8 border-2 border-green-500 rounded-xl bg-green-500/10 animate-bloom">
                                <CheckCircle size={48} className="text-green-500 mb-4" />
                                <span className="text-xl font-bold text-green-500 uppercase tracking-widest">Access Granted</span>
                                <p className="mt-2 text-sm opacity-70">See you there.</p>
                            </div>
                        ) : (
                            <button
                                onClick={() => setShowRSVP(true)}
                                className={`py-4 px-12 text-xl font-bold rounded-none uppercase tracking-widest transition-all hover:scale-105 ${t.button}`}
                            >
                                RSVP Now
                            </button>
                        )}
                    </footer>
                </div>
            );
        };

        // Builder (Admin) Component
        const Builder = ({ content, setContent, theme, setTheme, onPreview }) => {
            const [isGenerating, setIsGenerating] = useState(false);

            const handleInputChange = (e) => {
                const { name, value } = e.target;
                setContent(prev => ({ ...prev, [name]: value }));
            };

            const generateStory = () => {
                setIsGenerating(true);
                setTimeout(() => {
                    const randomStory = STORY_PROMPTS[Math.floor(Math.random() * STORY_PROMPTS.length)];
                    setContent(prev => ({ ...prev, story: randomStory + " (AI Generated)" }));
                    setIsGenerating(false);
                }, 1500);
            };

            return (
                <div className="min-h-screen bg-gray-900 text-white p-4 md:p-8 font-sans">
                    <header className="flex justify-between items-center mb-8 pb-4 border-b border-gray-700">
                        <h1 className="text-2xl font-bold flex items-center gap-2">
                            <Cpu className="text-cyan-400" />
                            Vow.AI <span className="text-xs bg-cyan-900 text-cyan-300 px-2 py-1 rounded">BUILDER MODE</span>
                        </h1>
                        <button
                            onClick={onPreview}
                            className="bg-cyan-500 hover:bg-cyan-400 text-black px-4 py-2 rounded font-bold flex items-center gap-2 transition-colors"
                        >
                            <Eye size={18} /> Preview Guest View
                        </button>
                    </header>

                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                        {/* Editor Column */}
                        <div className="space-y-8">
                            {/* Theme Selection */}
                            <div className="bg-gray-800 p-6 rounded-lg border border-gray-700">
                                <h2 className="text-lg font-semibold mb-4 flex items-center gap-2"><Sparkles size={18} /> Select Theme</h2>
                                <div className="grid grid-cols-3 gap-4">
                                    {Object.values(THEMES).map((t) => (
                                        <button
                                            key={t.id}
                                            onClick={() => setTheme(t.id)}
                                            className={`p-4 rounded border-2 text-center transition-all ${
                                                theme === t.id
                                                ? 'border-cyan-500 bg-gray-700'
                                                : 'border-gray-600 hover:border-gray-500'
                                            }`}
                                        >
                                            <div className="flex justify-center mb-2">
                                                <t.icon size={24} className={theme === t.id ? 'text-cyan-400' : 'text-gray-400'} />
                                            </div>
                                            <span className="text-sm font-medium">{t.name}</span>
                                        </button>
                                    ))}
                                </div>
                            </div>

                            {/* Details Form */}
                            <div className="bg-gray-800 p-6 rounded-lg border border-gray-700 space-y-4">
                                <h2 className="text-lg font-semibold mb-4 flex items-center gap-2"><Edit size={18} /> Event Details</h2>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-xs uppercase tracking-wider text-gray-400 mb-1">Couple Name</label>
                                        <input
                                            type="text"
                                            name="coupleName"
                                            value={content.coupleName}
                                            onChange={handleInputChange}
                                            className="w-full bg-gray-900 border border-gray-600 rounded p-2 focus:border-cyan-500 focus:outline-none"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs uppercase tracking-wider text-gray-400 mb-1">Date</label>
                                        <input
                                            type="date"
                                            name="date"
                                            value={content.date}
                                            onChange={handleInputChange}
                                            className="w-full bg-gray-900 border border-gray-600 rounded p-2 focus:border-cyan-500 focus:outline-none"
                                        />
                                    </div>
                                </div>
                                <div>
                                    <label className="block text-xs uppercase tracking-wider text-gray-400 mb-1">Venue</label>
                                    <input
                                        type="text"
                                        name="venue"
                                        value={content.venue}
                                        onChange={handleInputChange}
                                        className="w-full bg-gray-900 border border-gray-600 rounded p-2 focus:border-cyan-500 focus:outline-none"
                                    />
                                </div>
                            </div>

                            {/* AI Story Generator */}
                            <div className="bg-gray-800 p-6 rounded-lg border border-gray-700 relative overflow-hidden">
                                <div className="flex justify-between items-center mb-4">
                                    <h2 className="text-lg font-semibold flex items-center gap-2"><Zap size={18} /> Love Story</h2>
                                    <button
                                        onClick={generateStory}
                                        disabled={isGenerating}
                                        className="text-xs bg-purple-600 hover:bg-purple-500 text-white px-3 py-1 rounded flex items-center gap-1 disabled:opacity-50"
                                    >
                                        {isGenerating ? 'GENERATING...' : 'AI GENERATE'}
                                    </button>
                                </div>
                                <textarea
                                    name="story"
                                    value={content.story}
                                    onChange={handleInputChange}
                                    rows={4}
                                    className="w-full bg-gray-900 border border-gray-600 rounded p-2 focus:border-cyan-500 focus:outline-none resize-none"
                                />
                                {isGenerating && (
                                    <div className="absolute inset-0 bg-gray-900/80 flex items-center justify-center">
                                        <div className="animate-spin rounded-full h-8 w-8 border-t-2 border-b-2 border-purple-500"></div>
                                    </div>
                                )}
                            </div>
                        </div>

                        {/* Live Preview (Mini) */}
                        <div className="hidden lg:block bg-black rounded-xl border-4 border-gray-800 overflow-hidden relative h-[800px] shadow-2xl">
                             <div className="absolute top-0 w-full bg-gray-800 text-center text-xs py-1 text-gray-500">
                                PHONE PREVIEW
                             </div>
                             <div className="h-full relative">
                                <GuestView
                                    content={content}
                                    theme={theme}
                                    rsvpStatus="pending"
                                    setRsvpStatus={() => {}}
                                    isPlaying={false}
                                    togglePlay={() => {}}
                                    isPreview={true}
                                />
                             </div>
                        </div>
                    </div>
                </div>
            );
        };

        // Main App Orchestrator
        function App() {
            const [mode, setMode] = useState('builder'); // 'builder' | 'guest'
            const [theme, setTheme] = useState('cyberpunk');
            const [content, setContent] = useState(DEFAULT_EVENT);
            const [rsvpStatus, setRsvpStatus] = useState('pending');
            const [isPlaying, setIsPlaying] = useState(false);

            const togglePlay = () => setIsPlaying(!isPlaying);

            return (
                <React.Fragment>
                    {mode === 'builder' ? (
                        <Builder
                            content={content}
                            setContent={setContent}
                            theme={theme}
                            setTheme={setTheme}
                            onPreview={() => setMode('guest')}
                        />
                    ) : (
                        <div className="relative">
                             <button
                                onClick={() => setMode('builder')}
                                className="fixed top-4 left-4 z-[100] bg-black/50 hover:bg-black text-white p-2 rounded-full backdrop-blur border border-white/20 transition-all"
                                title="Back to Builder"
                            >
                                <Edit size={16} />
                            </button>
                            <GuestView
                                content={content}
                                theme={theme}
                                rsvpStatus={rsvpStatus}
                                setRsvpStatus={setRsvpStatus}
                                isPlaying={isPlaying}
                                togglePlay={togglePlay}
                            />
                        </div>
                    )}
                </React.Fragment>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
